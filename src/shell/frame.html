<div class="mw" id="mw">
  <canvas class="mw-menu" id="c-menu" aria-hidden="true"></canvas>
  <div class="mw-desk" id="desk">

    <div class="mw-files" id="files"></div>

    <div class="mw-win" id="win" hidden>
      <canvas class="mw-title" id="c-title" aria-hidden="true"></canvas>
      <button class="mw-x" id="xbtn" type="button" aria-label="Close this file"></button>
      <div class="mw-body">
        <div class="mw-view" id="view" tabindex="0" role="document" aria-label="Case file">
          <div id="docs"></div>
          <div class="mw-end">
            <button class="mw-done" id="done" type="button" aria-label="Done">
              <canvas id="c-done" width="240" height="56"></canvas>
            </button>
          </div>
        </div>
        <canvas class="mw-bar" id="c-bar" aria-hidden="true"></canvas>
      </div>
    </div>

    <div class="mw-zoom" id="zoom" aria-hidden="true"></div>
  </div>
</div>
